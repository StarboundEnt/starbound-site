<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative hex-grid population complexity map</title>
  <desc id="desc">A fictional service catchment represented by equal-sized hexagonal areas, coloured from stable through survival. Five outlined cells indicate meaningful quarterly movement.</desc>
