    <path id="catchment" d="M88 191 124 128 205 105 263 58 350 76 414 53 496 87 582 82 646 134 682 218 650 278 690 344 653 424 575 453 519 505 428 485 351 520 284 478 202 490 142 438 73 405 91 329 47 269Z"/>
    <clipPath id="catchmentClip"><use href="#catchment"/></clipPath>
